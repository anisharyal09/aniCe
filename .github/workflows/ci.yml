# SPDX-License-Identifier: GPL-3.0-or-later
# Runs the shared and Android host verification gates on isolated Linux runners.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'micro-feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-linux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            protocol/test-vectors/session/requirements.txt

      - name: Set up Java and Gradle dependency cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install verification dependencies
        run: |
          mkdir -p build/reports/ci
          python3 -m pip install -r scripts/requirements.txt 2>&1 | tee build/reports/ci/python-setup.log

      - name: Set up Rust and Android targets
        id: rust
        run: |
          rustup toolchain install stable --profile minimal 2>&1 | tee build/reports/ci/rust-setup.log
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android 2>&1 | tee -a build/reports/ci/rust-setup.log
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo dependencies and pairing builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/pairing/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('core/rust/pairing/Cargo.lock', 'core/rust/pairing/Cargo.toml', 'core/rust/pairing/src/**', 'scripts/build-pairing-native.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.version }}-

      - name: Install Android SDK and NDK components
        run: |
          # Only yes may ignore SIGPIPE; SDK/license failures must retain their exit status and log.
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses 2>&1 | tee build/reports/ci/android-licenses.log
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 2>&1 | tee build/reports/ci/android-setup.log
          echo "ANICE_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Verify shared and Android host suites
        run: python3 scripts/verify-suite.py fast --android --vector-python "$(command -v python3)"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-linux-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/reports/ci/
            build/reports/verification/
            apps/android/app/build/test-results/
            apps/android/app/build/reports/
