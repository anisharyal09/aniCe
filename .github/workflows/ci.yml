# SPDX-License-Identifier: GPL-3.0-or-later
# Runs independent verification lanes on GitHub-hosted runners.  The workflow
# only prepares toolchains and invokes scripts/verify-suite.py; acceptance
# rules, floors and report parsing live in the verifier.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'micro-feat/**', 'seamless-redesign']
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify-ci-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Install pinned actionlint
        run: |
          mkdir -p build/tools
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output build/tools/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  build/tools/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file build/tools/actionlint.tar.gz \
            --directory build/tools actionlint
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Verify workflow syntax and policy
        run: python3 scripts/verify-suite.py --only ci-integrity

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-ci-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/reports/verification/

  verify-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            protocol/test-vectors/session/requirements.txt

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Verify contracts and independent oracles
        run: python3 scripts/verify-suite.py --only contracts --vector-python "$(command -v python3)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/reports/verification/

  verify-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify Rust pairing bridge
        run: python3 scripts/verify-suite.py --only rust

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-rust-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/reports/verification/

  verify-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Java and Gradle dependency cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust and Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android SDK and NDK components
        run: |
          mkdir -p build/reports/ci
          # Only yes may ignore SIGPIPE; SDK/license failures must retain their exit status and log.
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses 2>&1 | tee build/reports/ci/android-licenses.log
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 2>&1 | tee build/reports/ci/android-setup.log
          echo "ANICE_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Verify Android host suites
        run: python3 scripts/verify-suite.py --only android

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-android-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/reports/verification/
            build/reports/ci/
            apps/android/app/build/test-results/
            apps/android/app/build/reports/

  verify-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Xcode 26.3 is the newest hosted image on macos-15. Pinning the full
      # developer directory prevents a runner-image default from silently
      # changing the compiler, SDK or result-bundle tooling.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Rust and macOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Prepare isolated test keychain
        # Keep hosted identity tests separate from the runner's login keychain.
        run: |
          security create-keychain -p "" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "" ci.keychain
          security set-keychain-settings -lut 7200 ci.keychain

      - name: Verify macOS app
        run: python3 scripts/verify-suite.py --only macos

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-macos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/reports/verification/

  verify-required:
    # This is the only branch-protection check.  It has no checkout and no
    # token, so it cannot execute pull-request code.  The workflow file itself
    # must be protected by CODEOWNERS and required code-owner review.
    if: always()
    needs: [verify-ci-integrity, verify-contracts, verify-rust, verify-android, verify-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_LANES: verify-ci-integrity verify-contracts verify-rust verify-android verify-macos
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          try:
              expected = os.environ["EXPECTED_LANES"].split()
              needs = json.loads(os.environ["NEEDS_JSON"])
          except (KeyError, json.JSONDecodeError) as error:
              print("::error::Cannot read required lane results: %s" % error)
              sys.exit(1)
          if not expected:
              print("::error::No required lanes were declared")
              sys.exit(1)
          if not isinstance(needs, dict):
              print("::error::Required lane results are not an object")
              sys.exit(1)

          problems = []
          for name in expected:
              row = needs.get(name)
              if not isinstance(row, dict):
                  problems.append("%s: missing" % name)
                  continue
              result = row.get("result")
              if result != "success":
                  problems.append("%s: %s" % (name, result))
          unexpected = sorted(set(needs) - set(expected))
          if unexpected:
              problems.append("unexpected lanes: " + ", ".join(unexpected))

          if problems:
              print("::error::Required verification did not succeed: " + "; ".join(problems))
              for problem in problems:
                  print("| " + problem)
              sys.exit(1)
          print("All required lanes succeeded: " + ", ".join(expected))
          PY
