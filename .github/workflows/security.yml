# SPDX-License-Identifier: GPL-3.0-or-later
# Automated static security analysis and supply chain scanning.
# Advisory scans: CodeQL analyzes trunk (main), schedule, and manual dispatch.
# (Not part of verify-required merge gates; run out-of-band to prevent fork PR token privilege escalation).
name: Security Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    name: Detect CodeQL scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_codeql: ${{ steps.classify.outputs.run_codeql }}
      codeql_languages: ${{ steps.classify.outputs.codeql_languages }}
      run_swift: ${{ steps.classify.outputs.run_swift }}
    steps:
      - name: Check out sources for change classification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify CodeQL languages
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py --mode codeql --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  codeql:
    name: CodeQL Analysis
    needs: detect-changes
    if: needs.detect-changes.outputs.run_codeql != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-changes.outputs.codeql_languages || '["python","actions","java-kotlin"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java for Kotlin extraction
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Cargo downloads
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('core/rust/pairing/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-

      - name: Install Android build prerequisites
        if: matrix.language == 'java-kotlin'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
          echo "ANICE_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        # The former pin bundled discontinued CodeQL 2.20.6.
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: linked
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      - name: Build Android app for CodeQL
        if: matrix.language == 'java-kotlin'
        run: apps/android/gradlew --console=plain --no-daemon --no-build-cache -p apps/android assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'

  codeql-swift:
    name: CodeQL Analysis (Swift)
    needs: detect-changes
    if: needs.detect-changes.outputs.run_swift != 'false'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # Traced Swift analysis must remain below macOS/Xcode 27; do not mirror a local upgrade blindly.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: linked
          languages: swift
          build-mode: manual

      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('core/rust/pairing/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-

      - name: Set up Rust and macOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Build macOS native pairing bridge
        run: python3 scripts/build-pairing-native.py macos

      - name: Build macOS app for CodeQL
        run: |
          xcodebuild -project apps/macos/aniCe.xcodeproj -scheme aniCe \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/anice-codeql-macos" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:swift'
