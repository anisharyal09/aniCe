# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "anice-pairing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
[lib]
name = "anice_pairing"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
